<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Odin Project</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="calculator">
        <div class="calculator-display">
            
        </div>
        <div class="layout">
            <div class="btns">
                <button onclick="updateNum(7)">7</button>
                <button onclick="updateNum(8)">8</button>
                <button onclick="updateNum(9)">9</button>
                <button onclick="updateNum(4)">4</button>
                <button onclick="updateNum(5)">5</button>
                <button onclick="updateNum(6)">6</button>
                <button onclick="updateNum(1)">1</button>
                <button onclick="updateNum(2)">2</button>
                <button onclick="updateNum(3)">3</button>
                <button onclick="updateNum(0)">0</button>
                <button onclick="updateNum('.')">.</button>
                <button onclick="resetValues()">AC</button>
            </div>
            <div class="operator-btns">
                <button onclick="goBack()">CE</button>
                <button onclick="setOperator('/')">/</button>
                <button onclick="setOperator('*')">*</button>
                <button onclick="setOperator('-')">-</button>
                <button onclick="setOperator('+')">+</button>
                <button onclick="getResult()">=</button>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
